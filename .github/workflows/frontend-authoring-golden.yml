name: Frontend Authoring Golden

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  VIRUNE_CANDIDATE_SHA: 87a34a3062f7b78964ed1c3522298908f009329c

jobs:
  candidate-producer:
    name: Frontend candidate producer
    runs-on: ubuntu-24.04
    outputs:
      virune_sha: ${{ steps.identity.outputs.virune_sha }}
    steps:
      - name: Checkout exact Virune candidate
        uses: actions/checkout@v4
        with:
          repository: yaona807/virune
          ref: ${{ env.VIRUNE_CANDIDATE_SHA }}
          path: virune-source
          fetch-depth: 1
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact Virune source identity
        id: identity
        working-directory: virune-source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$VIRUNE_CANDIDATE_SHA"
          echo "virune_sha=$actual" >> "$GITHUB_OUTPUT"
      - name: Install Virune producer dependencies
        working-directory: virune-source
        run: npm ci
      - name: Build reviewed Virune package candidate
        working-directory: virune-source
        run: npm run pack:virune
      - name: Verify reviewed package contents
        working-directory: virune-source
        run: node scripts/verify-npm-release-candidate-contents.mjs
      - name: Verify release integrity metadata
        working-directory: virune-source/release
        run: sha256sum --check SHA256SUMS
      - name: Upload exact release candidate
        uses: actions/upload-artifact@v4
        with:
          name: frontend-authoring-virune-candidate
          path: virune-source/release/
          if-no-files-found: error
          retention-days: 1

  preact-consumer:
    name: Component/View + Preact / Ubuntu 24.04 / Node 24 consumer
    needs: candidate-producer
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Golden head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify producer identity
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.candidate-producer.outputs.virune_sha }}" = "$VIRUNE_CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Download exact Virune release artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-authoring-virune-candidate
          path: .candidate/virune-release
      - name: Verify downloaded release checksums
        working-directory: .candidate/virune-release
        run: sha256sum --check SHA256SUMS
      - name: Verify six-package candidate identity
        run: node scripts/verify-candidate.mjs .candidate/virune-release
      - name: Install pinned Preact frontend dependencies
        working-directory: preact
        run: npm ci
      - name: Install exact Virune six-package consumer surface
        working-directory: preact
        run: node ../scripts/install-candidate.mjs ../.candidate/virune-release
      - name: Assert consumer-only workspace
        shell: bash
        run: |
          set -euo pipefail
          test ! -e virune-source
          test ! -e ../virune-source
          ! git grep -nE '(packages/.*/src|\.\./virune|workspace:)' -- preact scripts
      - name: Virune frontend authoring check
        working-directory: preact
        run: npm run check:frontend-authoring
      - name: Virune frontend authoring build
        working-directory: preact
        run: npm run build:frontend-authoring
      - name: Run preserved JSX frontend authoring scenario
        working-directory: preact
        run: npm run golden:frontend-authoring

  react-consumer:
    name: Component/View + React / Ubuntu 24.04 / Node 24 consumer
    needs: candidate-producer
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Golden head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify producer identity
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.candidate-producer.outputs.virune_sha }}" = "$VIRUNE_CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Download exact Virune release artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-authoring-virune-candidate
          path: .candidate/virune-release
      - name: Verify downloaded release checksums
        working-directory: .candidate/virune-release
        run: sha256sum --check SHA256SUMS
      - name: Verify six-package candidate identity
        run: node scripts/verify-candidate.mjs .candidate/virune-release
      - name: Install pinned React frontend dependencies
        working-directory: react
        run: npm ci
      - name: Install exact Virune six-package consumer surface
        working-directory: react
        run: node ../scripts/install-candidate.mjs ../.candidate/virune-release
      - name: Assert consumer-only workspace
        shell: bash
        run: |
          set -euo pipefail
          test ! -e virune-source
          test ! -e ../virune-source
          ! git grep -nE '(packages/.*/src|\.\./virune|workspace:)' -- react scripts
      - name: Virune React frontend authoring check
        working-directory: react
        run: npm run check:frontend-authoring
      - name: Virune React frontend authoring build
        working-directory: react
        run: npm run build:frontend-authoring
      - name: Run React preserved JSX frontend authoring scenario
        working-directory: react
        run: npm run golden:frontend-authoring

  solid-consumer:
    name: Contextual View callback + Solid For / Ubuntu 24.04 / Node 24 consumer
    needs: candidate-producer
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Golden head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify producer identity
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.candidate-producer.outputs.virune_sha }}" = "$VIRUNE_CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Download exact Virune release artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-authoring-virune-candidate
          path: .candidate/virune-release
      - name: Verify downloaded release checksums
        working-directory: .candidate/virune-release
        run: sha256sum --check SHA256SUMS
      - name: Verify six-package candidate identity
        run: node scripts/verify-candidate.mjs .candidate/virune-release
      - name: Install pinned Solid frontend dependencies
        working-directory: solid
        run: npm ci
      - name: Install exact Virune six-package consumer surface
        working-directory: solid
        run: node ../scripts/install-candidate.mjs ../.candidate/virune-release
      - name: Assert consumer-only workspace
        shell: bash
        run: |
          set -euo pipefail
          test ! -e virune-source
          test ! -e ../virune-source
          ! git grep -nE '(packages/.*/src|\.\./virune|workspace:)' -- solid scripts
      - name: Virune Solid contextual callback check
        working-directory: solid
        run: npm run check:frontend-authoring
      - name: Virune Solid contextual callback build
        working-directory: solid
        run: npm run build:frontend-authoring
      - name: Run Solid contextual View callback scenario
        working-directory: solid
        run: npm run golden:frontend-authoring

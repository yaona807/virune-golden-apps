name: Qwik Lock Bootstrap

on:
  pull_request:
    paths:
      - 'qwik-host-prototype/package.json'
      - '.github/workflows/qwik-lock-bootstrap.yml'

permissions:
  contents: read

jobs:
  lock:
    name: Resolve Qwik lock / Ubuntu 24.04 / Node 24
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Resolve exact Qwik dependency graph
        working-directory: qwik-host-prototype
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps
      - name: Emit resolved lock
        working-directory: qwik-host-prototype
        shell: bash
        run: |
          echo 'QWIK_LOCK_GZIP_BASE64_BEGIN'
          gzip -c package-lock.json | base64 -w0
          echo
          echo 'QWIK_LOCK_GZIP_BASE64_END'

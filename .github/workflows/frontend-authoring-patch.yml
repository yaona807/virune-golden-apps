name: Frontend authoring workflow patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'test/frontend-authoring-preact-jsx'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Patch existing Golden workflow only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/p-queue-golden.yml')
          text = path.read_text()
          old_sha = '492f6bbe1f4252c5483548f1f23cb072127472b6'
          new_sha = '53948d9f8759c72fd8cbab70fccebd8160461576'
          if text.count(old_sha) != 1:
              raise SystemExit('expected exactly one old candidate SHA')
          text = text.replace(old_sha, new_sha)

          anchor = '''      - name: Run Preact jsdom Golden scenario
            working-directory: preact
            run: npm run golden
          '''
          addition = anchor + '''      - name: Virune frontend authoring check
            working-directory: preact
            run: npm run check:frontend-authoring
          - name: Virune frontend authoring build
            working-directory: preact
            run: npm run build:frontend-authoring
          - name: Run preserved JSX frontend authoring scenario
            working-directory: preact
            run: npm run golden:frontend-authoring
          '''
          if text.count(anchor) != 1:
              raise SystemExit('expected exactly one Preact Golden anchor')
          path.write_text(text.replace(anchor, addition))
          PY
          rm .github/workflows/frontend-authoring-patch.yml
      - name: Commit workflow update
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows/p-queue-golden.yml .github/workflows/frontend-authoring-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(frontend): run preserved JSX consumer'
          git push origin HEAD:${{ github.head_ref }}

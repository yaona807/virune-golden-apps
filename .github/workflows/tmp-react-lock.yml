name: Temporary React lock generation

on:
  push:
    branches:
      - test/frontend-react-runtime
    paths:
      - react/package.json
      - .github/workflows/tmp-react-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate exact lockfile
        working-directory: react
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(frontend): generate React lockfile"
          git push origin HEAD:test/frontend-react-runtime

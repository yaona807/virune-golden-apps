name: Generate Preact lock

on:
  pull_request:
    paths:
      - preact/package.json
      - .github/workflows/generate-preact-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve exact lockfile
        working-directory: preact
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- preact/package-lock.json && git ls-files --error-unmatch preact/package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add preact/package-lock.json
          git commit -m 'test(golden): lock Preact frontend dependencies'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

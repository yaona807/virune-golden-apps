name: Bootstrap Axios lock

on:
  push:
    branches:
      - test/57-axios-ecosystem-differential

permissions:
  contents: write

jobs:
  generate-lock:
    if: ${{ !contains(github.event.head_commit.message, 'pin Axios ecosystem dependencies') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: test/57-axios-ecosystem-differential
          fetch-depth: 1
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate exact npm lockfile
        working-directory: ecosystem/axios
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Yaona"
          git config user.email "72598968+yaona807@users.noreply.github.com"
          git add ecosystem/axios/package-lock.json
          git rm .github/workflows/bootstrap-axios-lock.yml
          git commit -m "chore: pin Axios ecosystem dependencies"
          git push origin HEAD:test/57-axios-ecosystem-differential

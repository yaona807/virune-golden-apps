name: Multi-layer lock bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate-lock:
    name: Generate multi-layer npm lock
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Golden head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate npm lockfile
        working-directory: multi-layer
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit exact generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha }}'
          actual="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin 'refs/heads/test/29-multi-layer-reference' | cut -f1)"
          test "$actual" = "$expected"
          test "$remote" = "$expected"
          git add multi-layer/package-lock.json
          ! git diff --cached --quiet
          git config user.name 'Yaona'
          git config user.email '72598968+yaona807@users.noreply.github.com'
          git commit -m 'test(golden): lock multi-layer dependencies'
          git push origin HEAD:test/29-multi-layer-reference

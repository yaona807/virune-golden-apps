name: Ecosystem Differential

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  VIRUNE_CANDIDATE_SHA: 492f6bbe1f4252c5483548f1f23cb072127472b6

jobs:
  candidate-producer:
    name: Candidate producer
    runs-on: ubuntu-24.04
    outputs:
      virune_sha: ${{ steps.identity.outputs.virune_sha }}
    steps:
      - name: Checkout exact Virune candidate
        uses: actions/checkout@v4
        with:
          repository: yaona807/virune
          ref: ${{ env.VIRUNE_CANDIDATE_SHA }}
          path: virune-source
          fetch-depth: 1
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact Virune source identity
        id: identity
        working-directory: virune-source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$VIRUNE_CANDIDATE_SHA"
          echo "virune_sha=$actual" >> "$GITHUB_OUTPUT"
      - name: Install Virune producer dependencies
        working-directory: virune-source
        run: npm ci
      - name: Build reviewed Virune package candidate
        working-directory: virune-source
        run: npm run pack:virune
      - name: Verify reviewed package contents
        working-directory: virune-source
        run: node scripts/verify-npm-release-candidate-contents.mjs
      - name: Verify release integrity metadata
        working-directory: virune-source/release
        run: sha256sum --check SHA256SUMS
      - name: Upload exact release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-virune-candidate
          path: virune-source/release/
          if-no-files-found: error
          retention-days: 1

  date-fns-consumer:
    name: date-fns differential / Ubuntu 24.04 / Node 24
    needs: candidate-producer
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Golden head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify producer identity
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.candidate-producer.outputs.virune_sha }}" = "$VIRUNE_CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Download exact Virune release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ecosystem-virune-candidate
          path: .candidate/virune-release
      - name: Verify downloaded release checksums
        working-directory: .candidate/virune-release
        run: sha256sum --check SHA256SUMS
      - name: Verify six-package candidate identity
        run: node scripts/verify-candidate.mjs .candidate/virune-release
      - name: Install pinned date-fns differential dependencies
        working-directory: ecosystem/date-fns
        run: npm ci
      - name: Install exact Virune six-package consumer surface
        working-directory: ecosystem/date-fns
        run: node ../../scripts/install-candidate.mjs ../../.candidate/virune-release
      - name: Assert consumer-only workspace
        shell: bash
        run: |
          set -euo pipefail
          test ! -e virune-source
          test ! -e ../virune-source
          test ! -e ecosystem/virune-source
          ! git grep -nE '(packages/.*/src|\.\./virune|workspace:)' -- ecosystem/date-fns scripts
          ! git grep -nE '\.interop\.ts' -- ecosystem/date-fns
      - name: Virune check
        working-directory: ecosystem/date-fns
        run: npm run check
      - name: Virune build
        working-directory: ecosystem/date-fns
        run: npm run build
      - name: Run date-fns ecosystem differential
        working-directory: ecosystem/date-fns
        run: npm run golden

  axios-consumer:
    name: Axios differential / Ubuntu 24.04 / Node 24
    needs: candidate-producer
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Golden head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify producer identity
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.candidate-producer.outputs.virune_sha }}" = "$VIRUNE_CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Download exact Virune release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ecosystem-virune-candidate
          path: .candidate/virune-release
      - name: Verify downloaded release checksums
        working-directory: .candidate/virune-release
        run: sha256sum --check SHA256SUMS
      - name: Verify six-package candidate identity
        run: node scripts/verify-candidate.mjs .candidate/virune-release
      - name: Install pinned Axios differential dependencies
        working-directory: ecosystem/axios
        run: npm ci
      - name: Install exact Virune six-package consumer surface
        working-directory: ecosystem/axios
        run: node ../../scripts/install-candidate.mjs ../../.candidate/virune-release
      - name: Assert consumer-only workspace
        shell: bash
        run: |
          set -euo pipefail
          test ! -e virune-source
          test ! -e ../virune-source
          test ! -e ecosystem/virune-source
          ! git grep -nE '(packages/.*/src|\.\./virune|workspace:)' -- ecosystem/axios scripts
          ! git grep -nE '\.interop\.ts' -- ecosystem/axios
      - name: Virune check
        working-directory: ecosystem/axios
        run: npm run check
      - name: Virune build
        working-directory: ecosystem/axios
        run: npm run build
      - name: Run Axios ecosystem differential
        working-directory: ecosystem/axios
        run: npm run golden

name: Repetition Host Prototype

on:
  pull_request:
    paths:
      - 'solid-host-prototype/**'
      - 'react/scripts/repetition-host-prototype.mjs'
      - 'react/package.json'
      - 'react/package-lock.json'
      - 'preact/scripts/repetition-host-prototype.mjs'
      - 'preact/package.json'
      - 'preact/package-lock.json'
      - 'vue-host-prototype/**'
      - 'qwik-host-prototype/**'
      - '.github/workflows/repetition-host-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solid-host:
    name: Solid identity-group host / Ubuntu 24.04 / Node 24
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Install pinned prototype dependencies
        working-directory: solid-host-prototype
        run: npm ci --ignore-scripts
      - name: Run Solid repetition host prototype against browser runtime
        working-directory: solid-host-prototype
        run: node --conditions=browser repetition-host-prototype.mjs

  react-host:
    name: React identity-group host / Ubuntu 24.04 / Node 24
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Install pinned React consumer dependencies
        working-directory: react
        run: npm ci --ignore-scripts
      - name: Run React repetition host prototype against browser runtime
        working-directory: react
        run: node scripts/repetition-host-prototype.mjs

  preact-host:
    name: Preact identity-group host / Ubuntu 24.04 / Node 24
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Install pinned Preact consumer dependencies
        working-directory: preact
        run: npm ci --ignore-scripts
      - name: Run Preact repetition host prototype against browser runtime
        working-directory: preact
        run: node scripts/repetition-host-prototype.mjs

  vue-host:
    name: Vue identity-group host / Ubuntu 24.04 / Node 24
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Install pinned Vue prototype dependencies
        working-directory: vue-host-prototype
        run: npm ci --ignore-scripts
      - name: Run Vue repetition host prototype against Vue renderer
        working-directory: vue-host-prototype
        run: node repetition-host-prototype.mjs

  qwik-host:
    name: Qwik identity-group host / Ubuntu 24.04 / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Install pinned Qwik prototype dependencies
        working-directory: qwik-host-prototype
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Run Qwik repetition host prototype against Qwik renderer
        working-directory: qwik-host-prototype
        run: node --conditions=development repetition-host-prototype.mjs

name: Temporary Radix Switch lockfile generation

on:
  push:
    branches:
      - test/radix-switch-component-94

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve the committed React consumer dependency lock
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix react
          printf '%s\n' 'RADIX_SWITCH_LOCK_OUTPUT_BEGIN'
          cat react/package-lock.json
          printf '%s\n' 'RADIX_SWITCH_LOCK_OUTPUT_END'
